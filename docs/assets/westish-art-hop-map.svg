<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">Simple wayfinding map to Westish Shop</title>
  <desc id="map-description">A simplified, not-to-scale wayfinding map. Stewart Road runs across the north. The open field and Euphoria Chocolate are north of Stewart Road. South Bertelsen Road runs along the west, West 11th Avenue runs along the south, Amazon Creek crosses diagonally between them, and Westish Shop at 1009 South Bertelsen Road is marked west of the creek.</desc>

  <rect width="1200" height="760" fill="#fffaf0"/>

  <!-- Reference landmarks north of Stewart Road -->
  <rect x="72" y="72" width="324" height="156" rx="18" fill="#dce9be" stroke="#a7bf7b" stroke-width="4"/>
  <text x="234" y="137" text-anchor="middle" fill="#53652d" font-family="Arial, sans-serif" font-size="31" font-weight="700">Open field</text>
  <text x="234" y="174" text-anchor="middle" fill="#6e7a49" font-family="Arial, sans-serif" font-size="22">reference landmark</text>

  <rect x="672" y="82" width="318" height="136" rx="18" fill="#fff" stroke="#d47725" stroke-width="5"/>
  <circle cx="736" cy="150" r="30" fill="#d47725"/>
  <path d="M718 150h36M736 132v36" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="786" y="143" fill="#7c401c" font-family="Arial, sans-serif" font-size="29" font-weight="700">Euphoria</text>
  <text x="786" y="178" fill="#7c401c" font-family="Arial, sans-serif" font-size="29" font-weight="700">Chocolate</text>

  <!-- Essential roads only -->
  <path d="M0 276 H1200" fill="none" stroke="#b7c3ca" stroke-width="54"/>
  <path d="M0 276 H1200" fill="none" stroke="#fff" stroke-width="3" opacity="0.9"/>
  <text x="1015" y="258" fill="#3d4d57" font-family="Arial, sans-serif" font-size="28" font-weight="700">Stewart Rd</text>

  <path d="M166 276 V760" fill="none" stroke="#b7c3ca" stroke-width="54"/>
  <path d="M166 276 V760" fill="none" stroke="#fff" stroke-width="3" opacity="0.9"/>
  <text x="138" y="604" fill="#3d4d57" font-family="Arial, sans-serif" font-size="28" font-weight="700" transform="rotate(-90 138 604)">S Bertelsen Rd</text>

  <path d="M0 668 H1200" fill="none" stroke="#b7c3ca" stroke-width="60"/>
  <path d="M0 668 H1200" fill="none" stroke="#fff" stroke-width="3" opacity="0.9"/>
  <text x="930" y="650" fill="#3d4d57" font-family="Arial, sans-serif" font-size="31" font-weight="700">W 11th Ave</text>

  <!-- Amazon Creek -->
  <path d="M344 293 C470 354 548 406 625 493 C688 565 767 612 915 692" fill="none" stroke="#cbe8cc" stroke-width="75" stroke-linecap="round"/>
  <path d="M344 293 C470 354 548 406 625 493 C688 565 767 612 915 692" fill="none" stroke="#85c7df" stroke-width="27" stroke-linecap="round"/>
  <path d="M344 293 C470 354 548 406 625 493 C688 565 767 612 915 692" fill="none" stroke="#3e91b7" stroke-width="6" stroke-linecap="round"/>
  <text x="615" y="472" fill="#317b85" font-family="Arial, sans-serif" font-size="29" font-weight="700" transform="rotate(41 615 472)">Amazon Creek</text>

  <!-- Destination marker -->
  <g>
    <circle cx="354" cy="453" r="54" fill="#d65336" stroke="#fffaf0" stroke-width="10"/>
    <circle cx="354" cy="453" r="17" fill="#fffaf0"/>
    <path d="M354 507 L323 566 H385 Z" fill="#d65336"/>
    <rect x="434" y="400" width="306" height="115" rx="15" fill="#fff" stroke="#d65336" stroke-width="5"/>
    <text x="462" y="443" fill="#7a301c" font-family="Arial, sans-serif" font-size="31" font-weight="800">Westish Shop</text>
    <text x="462" y="481" fill="#7a301c" font-family="Arial, sans-serif" font-size="24" font-weight="700">1009 S Bertelsen Rd</text>
  </g>

  <text x="45" y="725" fill="#6b643f" font-family="Arial, sans-serif" font-size="19" font-weight="700">Stylized wayfinding map · not to scale</text>
</svg>
