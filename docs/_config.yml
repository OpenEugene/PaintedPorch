title: The Painted Porch
description: >-
  Community wiki for the Painted Porch — a Warehouse District Art Hop venue
  in Eugene, Oregon.
theme: minima
url: "https://paintedporch.fyi"
repository_url: https://github.com/OpenEugene/PaintedPorch
favicon: /favicon.ico
# Fallback social-share image for docs pages (see _layouts/wikidown.html).
# Home.md sets its own `image:` front matter, read by minima's jekyll-seo-tag
# output instead, so it isn't affected by this key.
social_image: /assets/painted-porch-hero.jpg

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-relative-links
  - jekyll-titles-from-headings

optional_front_matter:
  enabled: true
default_layout: default

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: false

# Home.md pins its own `layout: default` in front matter to opt out of this
# and keep using the custom minima-based marketing layout instead.
#
# jekyll-titles-from-headings only sets page.title when a page's literal
# first line is a heading — ours all start with a wikidown:breadcrumb line
# first, so it never fires. Set title explicitly per page below instead.
# Update this list whenever a wiki page is added, renamed, or removed.
defaults:
  - scope:
      path: ""
    values:
      layout: wikidown
  - scope:
      path: "Docs.md"
    values:
      title: "Docs"
  - scope:
      path: "Columns.md"
    values:
      title: "Columns"
  - scope:
      path: "Columns/Bill of Materials.md"
    values:
      title: "Bill of Materials"
  - scope:
      path: "Columns/Assembly Instructions.md"
    values:
      title: "Assembly Instructions"
  - scope:
      path: "Image Prompts.md"
    values:
      title: "Image Prompts"
  - scope:
      path: "Events.md"
    values:
      title: "Events"
  - scope:
      path: "Music.md"
    values:
      title: "Music"
  - scope:
      path: "AI Disclaimer.md"
    values:
      title: "AI Disclaimer"
  - scope:
      path: "About.md"
    values:
      title: "About"

include:
  - .attachments
